# Keep Waydroid's renderer and buffer allocator on the same NVIDIA GPU.
# On this Intel UHD 630 / GTX 1660 Ti laptop, skiavk selected Intel while
# the allocator used NVIDIA. Intel rejected NVIDIA buffer layouts with
# VK_ERROR_UNKNOWN (-13), crashing the launcher and System UI.
# Restricting the host renderer to NVIDIA fixes this with the default skiavk
# renderer; the previous skiagl workaround is unnecessary.
#
# Install and initialize waydroid-nvidia following its instructions:
# https://github.com/Shiro836/waydroid-nvidia#install-arch--aur
# After applying this file:
#   waydroid session stop
#   systemctl --user daemon-reload
#   systemctl --user restart wd-venus.service
#   waydroid show-full-ui
#
# The driver manifest path is specific to Arch's NVIDIA package.
# This setting affects only wd-venus, not other desktop applications.
# Keep generated Waydroid configuration outside this repo.
[Service]
Environment=VK_DRIVER_FILES=/usr/share/vulkan/icd.d/nvidia_icd.json
